[project]
name = "shopassist"
version = "1.0.0"
description = "R3 grounded shopping assistant: answers only from the catalogue and store policy, with citations."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.10",
    "httpx>=0.27",
    # the organisers' scorer (scripts/evaluate.py) needs these two
    "numpy>=1.26",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopassist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["scripts/evaluate.py", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # the rupee sign and Hindi words are intentional
